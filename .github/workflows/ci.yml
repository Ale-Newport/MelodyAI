name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install (classical engine + API + CPU torch)
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch
          pip install -e ".[dev]" -e backend faiss-cpu tensorboard matplotlib
      - name: Lint
        run: ruff check melodyai backend tests scripts
      - name: Tests (no network, no Whisper model)
        env:
          MELODYAI_DEVICE: cpu
        run: pytest -q -m "not asr"
      - name: Quick benchmark (smoke)
        env:
          MELODYAI_DEVICE: cpu
        run: |
          python -m melodyai.cli train --config configs/train_smoke.yaml
          python -m melodyai.cli evaluate --config configs/eval_quick.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
