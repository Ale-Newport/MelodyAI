name: Dependency audit

# Known-vulnerability audit of the Python and npm dependency trees, on every change to them and weekly
# (new advisories appear without any change here). Pull requests also get GitHub's dependency review.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml", "backend/pyproject.toml", "frontend/package.json", "frontend/package-lock.json",
            ".github/workflows/security.yml"]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the engine and API with every extra
        run: |
          python -m pip install -U pip pip-audit
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,asr,pitch,dev]" -e backend
      - name: Audit the installed environment
        run: pip-audit --skip-editable --desc

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm audit --audit-level=moderate
