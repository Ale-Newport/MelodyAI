name: Release

# Pushing a tag vX.Y.Z builds the Python package and the static demo, and publishes a GitHub Release whose
# notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false   # no caches in the release job (cache poisoning)
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build the Python package
        run: python -m pip install -U build && python -m build --outdir dist
      - name: Build the static demo
        run: |
          cd frontend && npm ci && npm run build:pages
          cd dist && zip -qr "../../dist/melodyai-demo-site-${GITHUB_REF_NAME}.zip" .
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; if (index($0, "[" v "]")) { on = 1; next } }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for ${GITHUB_REF_NAME}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "MelodyAI ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          fi
