version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/backend"]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # The [pitch] extra pins setuptools<81 on purpose: basic-pitch 0.4 needs resampy<0.4.3, which imports
      # pkg_resources (removed in setuptools 81). Revisit when basic-pitch drops that pin.
      - dependency-name: setuptools

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # tailwind-merge 3 targets Tailwind CSS 4; the app uses Tailwind 3. Upgrade both together.
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies, docker]
    ignore:
      - dependency-name: python      # requires-python is >=3.10,<3.13
        versions: [">=3.13"]
