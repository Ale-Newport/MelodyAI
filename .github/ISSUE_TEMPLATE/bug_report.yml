name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behaviour. Do NOT attach recordings of other people or copyrighted audio.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15 / Apple M2, Python 3.11, Chrome 131"
  - type: textarea
    id: logs
    attributes:
      label: Logs / API response
      render: shell
