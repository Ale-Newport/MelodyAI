[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melodyai"
version = "0.1.0"
description = "Query-by-humming, whistling and lyrics song recognition engine (research toolkit)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "MelodyAI contributors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "numba>=0.59",
  "pretty_midi>=0.2.10",
  "mido>=1.3",
  "rapidfuzz>=3.6",
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "scikit-learn>=1.4",
  "psutil>=5.9",
  "setuptools<81", # pretty_midi / resampy still import pkg_resources
]

[project.optional-dependencies]
ml = ["torch>=2.2", "faiss-cpu>=1.8", "tensorboard>=2.15"]
asr = ["faster-whisper>=1.0"]
pitch = ["basic-pitch>=0.4", "torchcrepe>=0.0.22"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
melodyai = "melodyai.cli:main"

[tool.setuptools.packages.find]
include = ["melodyai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "asr: requires a downloaded faster-whisper model",
  "ml: requires torch",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "B905", "E741", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["melodyai", "app"]
