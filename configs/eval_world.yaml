# Real-song evaluation of the open-world (lyrics) recognition -- `make evaluate-world`
#   python -m melodyai.cli evaluate-world --config configs/eval_world.yaml [--limit N] [--no-tts] [--calibrate]
#
# Songs are listed by TITLE + ARTIST + language (+ tags) ONLY. Never add lyrics here (the loader rejects any other
# key): lyrics are looked up at run time (world index record, else LRCLIB) and query variants are regenerated from
# them with a seeded RNG, in memory only. Whether a song is already in the world index ("in_sync") is checked at
# run time, never hardcoded.
#
# Tags: genre and decade; group tags drive the summary tables:
#   tiktok    -- recent TikTok / viral songs, picked programmatically from Deezer editorial TikTok playlists by
#                melodyai.evaluation.world_eval.pick_trending (owner = a Deezer editor; LRCLIB lyrics in es/en);
#   long_tail -- well-known songs that are probably NOT in a popular-songs sync (older classics, album tracks):
#                they measure the online fallback.
name: world
seed: 7
store: null              # MELODYAI_STORE_DIR or data/store (world.db is only read: every search has learn=False)
lyrics_cache: null       # <store>/world_eval_cache.db (ground-truth lyrics lookups, cached)
join: " "                # query lines joined like one run-on transcript
language_hint: false     # typed variants are searched without a language (as when the app's language is "auto")
variants: [chorus, verse, line, misremembered, asr, asr_sung, negative]
conditions:
  index: {}                          # local world index only, offline
  online: {max_queries: 60}          # empty index + LRCLIB / Deezer (seeded sample, even over variants)
  both: {max_queries: 60}            # world index + online sources (the app's default)
online:
  sources: [index, lrclib, deezer]   # keyed sources (genius, claude) only when listed here and configured
  lrclib_rps: 0.4                    # average LRCLIB requests/s of the online conditions (shared free service)
  deadline_s: 9.0
misremembered: {drop: 0.15}
asr:
  model: auto                        # best cached Whisper model
  max_songs: 24
  stretch: 0.75
  voices: {es: [Paulina, Mónica], en: [Samantha, Daniel]}
negatives: {n: 30}
calibration:
  max_fmr: 0.05                      # false matches / (song queries + negatives)
  max_negative_fmr: 0.05
  conditions: null                   # all evaluated conditions

