# Optional alternative to the local install (`make setup && make demo-data && make dev`).
services:
  melodyai:
    build: .
    ports:
      - "8000:8000"         # open http://localhost:8000
    volumes:
      - melodyai-data:/data
    environment:
      MELODYAI_STORE_DIR: /data/store
      MELODYAI_DATA_DIR: /data
  # Optional PostgreSQL catalog (also set MELODYAI_DATABASE_URL and install psycopg in the image).
  # postgres:
  #   image: postgres:16
  #   environment: { POSTGRES_USER: melodyai, POSTGRES_PASSWORD: melodyai, POSTGRES_DB: melodyai }
volumes:
  melodyai-data:
